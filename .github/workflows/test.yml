name: test

# actions 统一用 v7（node24 运行时）。checkout / setup-node v4 与 setup-python v5
# 跑在 node20 上，runner 会给每个 job 挂「Node.js 20 is deprecated」告警。
on:
  push:
  pull_request:

jobs:
  regression:
    # README 承诺 Python 3.9+，而 ubuntu-latest 已迁到 26.04、镜像里没有 3.9
    # （setup-python 报 The version '3.9' ... was not found for Ubuntu 26.04）。
    # 兼容性下限要靠这一条腿守住，所以矩阵钉在还有 3.9 的 24.04。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # 插件测试与契约探针是 Node 22+（node:sqlite 在 22.5 才可用）。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 tests/run_tests.py

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 静态层 gate（文档死链 / 契约对账 / 版本一致 / 构建产物新鲜度 / 密钥扫描）
        run: |
          bash scripts/gate.sh --quick
